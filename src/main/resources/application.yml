# application.yml — thêm default values để tránh null khi chạy local
spring:
  application:
    name: finance-tracker

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/finance_tracker}
    username: ${SPRING_DATASOURCE_USERNAME:prostgre}
    password: ${SPRING_DATASOURCE_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    repair-on-migrate: true
    validate-on-migrate: false

  cache:
    type: simple

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${APP_JWT_SECRET:8d90d5d6-be52-478a-8037-9c2bab86f0cd}
    expiration-ms: 900000
    refresh-expiration-ms: 604800000
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    enabled: true
    path: /v3/api-docs


payos:
  client-id: ${PAYOS_CLIENT_ID:7d902b74-f645-4b78-b8d7-34ff18ed244b}
  api-key: ${PAYOS_API_KEY:ded11c19-3c6c-41ce-a032-7e0a78650de5}
  checksum-key: ${PAYOS_CHECKSUM_KEY:65cf4f17b5604230b8b971e2b53a4c1e71da81e14d007bc547ee0fe3d011e03f}
  return-url: ${PAYOS_RETURN_URL:http://localhost:5173/payment/success}
  cancel-url: ${PAYOS_CANCEL_URL:http://localhost:5173/payment/cancel}